version: '3.8'
services:
# ============================================
# CIRCUIT BREAKER - Protección SSD
# ============================================
circuit-breaker:
  image: docker.io/alpine:latest
  container_name: maximun-circuit-breaker
  restart: always
  entrypoint: ["/scripts/circuit_breaker.sh"]
  volumes:
    - ./scripts:/scripts:ro
    - ./logs:/logs:rw
    - /mnt/hdd:/mnt/hdd:rw
  deploy:
    resources:
      limits:
        memory: 32M
      reservations:
        memory: 16M

# ============================================
# MOSQUITTO - Broker MQTT (HMR-ACT)
# ============================================
mosquitto:
  image: docker.io/eclipse-mosquitto:latest
  container_name: maximun-mqtt
  restart: unless-stopped
  ports:
    - "1883:1883"
    - "9001:9001"
  volumes:
    - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    - ./data/mqtt:/mosquitto/data:rw
    - ./logs/mqtt:/mosquitto/log:rw
  deploy:
    resources:
      limits:
        memory: 128M

# ============================================
# REDIS - Caché rápido (topics MQTT)
# ============================================
redis:
  image: docker.io/redis:alpine
  container_name: maximun-redis
  restart: unless-stopped
  command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
  ports:
    - "6379:6379"
  volumes:
    - ./data/redis:/data:rw
  deploy:
    resources:
      limits:
        memory: 256M

# ============================================
# POSTGRESQL - Base de datos (feedback)
# ============================================
postgres:
  image: docker.io/postgres:15-alpine
  container_name: maximun-postgres
  restart: unless-stopped
  environment:
    POSTGRES_DB: maximun
    POSTGRES_USER: maximun
    POSTGRES_PASSWORD: kimi_secure_pass_2025
  ports:
    - "5432:5432"
  volumes:
    - ./data/postgres:/var/lib/postgresql/data:rw
  deploy:
    resources:
      limits:
        memory: 512M

networks:
  default:
    name: maximun-network
