# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Services CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  lint-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        flake8 services --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 services --count --exit-zero --max-complexity=12 --max-line-length=120 --statistics
    - name: Smoke scripts syntax
      run: |
        bash -n ops/self_test.sh ops/mqtt_smoke_test.sh ops/host_permissions.sh ops/preflight_host_check.sh ops/test_by_module.sh ops/microos_bootstrap.sh ops/install_from_usb.sh ops/deploy_microos.sh ops/module_control.sh ops/check_system_consistency.sh ops/generate_model_checksums.sh ops/generate_mqtt_tls_certs.sh ops/autocheck_modules.sh ops/install_autocheck_service.sh
    - name: Contract tests
      run: |
        pytest tests -q
